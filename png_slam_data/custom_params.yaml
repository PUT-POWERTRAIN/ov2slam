%YAML 1.0
---
#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
Camera.topic_left: /image_left_raw_data
Camera.topic_right: /image_right_raw_data
Camera.model_left: pinhole
Camera.model_right: pinhole

Camera.left_nwidth: 2048
Camera.left_nheight: 1080
Camera.right_nwidth: 2048
Camera.right_nheight: 1080

# Camera calibration and distortion parameters (OpenCV) 
Camera.fxl: 1814.5061420730431
Camera.fyl: 1814.5061420730431
Camera.cxl: 1026.1977130691339
Camera.cyl: 524.7984412358129
Camera.k1l: -0.082292808267338341
Camera.k2l: 0.1036602731851739
Camera.p1l: -0.0034940032414059268
Camera.p2l: 0.00084014002308057311

Camera.fxr: 1812.26306845315
Camera.fyr: 1812.26306845315
Camera.cxr: 1041.300936202379
Camera.cyr: 519.07223080294409
Camera.k1r: -0.080226526918819735
Camera.k2r: 0.093063204690196202
Camera.p1r: -0.0029454095837901139
Camera.p2r: 0.0011427467119549529

# Camera Extrinsic parameters T_b_ci ( v_b = T_b_ci * v_ci )
body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0., 0., 1., 5.0362549728344614,
            0., 1., 0., -0.44101021275849878,
            1., 0., 0., -1.771000242852925,
            0., 0., 0., 1.]
   # data: [0., 0.99, 0.14, 5.0362549728344614,
   #          1., 0., 0., -0.44101021275849878,
   #          0., 0.14, -0.99, -1.771000242852925,
   #          0., 0., 0., 1.]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0., 0, 1., 5.0100574394498949,
            0., 1., 0., 0.40231815989499159,
            1., 0., 0., -1.7616651319571297,
            0., 0., 0., 1.]
   # data: [0., 0.99, 0.14, 5.0100574394498949,
   #          1., 0., 0., 0.40231815989499159,
   #          0., 0.14, -0.99, -1.7616651319571297,
   #          0., 0., 0., 1.]


# Macierz rotacji kamery (3x3)
Camera.rotation_matrix: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [0., 0., -1.,
           1., 0., 0.,
           0., -1., 0.]

#--------------------------------------------------------------------------------------------
# SLAM Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
debug: 0
log_timings: 0

mono: 0
stereo: 1

force_realtime: 1

slam_mode: 1
buse_loop_closer: 1
bdo_stereo_rect: 0
alpha: 0.
bdo_undist: 0
finit_parallax: 20.

use_shi_tomasi: 0
use_fast: 0
use_brief: 1
use_singlescale_detector: 1
nmaxdist: 35
nfast_th: 10
dmaxquality: 0.001

use_clahe: 1
fclahe_val: 3

do_klt: 1
klt_use_prior: 1
btrack_keyframetoframe: 0
nklt_win_size: 9
nklt_pyr_lvl: 3
nmax_iter: 30
fmax_px_precision: 0.01
fmax_fbklt_dist: 0.5
nklt_err: 30.

bdo_track_localmap: 1
fmax_desc_dist: 0.2
fmax_proj_pxdist: 2.

doepipolar: 1
dop3p: 0
bdo_random: 1
nransac_iter: 100
fransac_err: 3.

fmax_reproj_err: 3.
buse_inv_depth: 1

robust_mono_th: 5.9915
use_sparse_schur: 1
use_dogleg: 0
use_subspace_dogleg: 0
use_nonmonotic_step: 0

apply_l2_after_robust: 1
nmin_covscore: 25

fkf_filtering_ratio: 0.95
do_full_ba: 0
